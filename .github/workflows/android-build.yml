name: Build Zoya Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish APK to GitHub Releases"
        required: false
        type: boolean
        default: true
      release_tag:
        description: "Optional release tag (defaults to v1.0.<run_number>)"
        required: false
        type: string
        default: ""
      application_id:
        description: "Optional Android package name override (e.g. com.devid.zoya.assistant)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies & build web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run lint
          npm run build
          npm run android:sync

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode upload keystore (optional for Play Store signing)
        id: decode_keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "keystore_path=$(pwd)/android/app/upload-keystore.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; using fallback/unsigned release config."
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.application_id }}" ]; then
            EXTRA_ARGS="-PZOYA_APPLICATION_ID=${{ github.event.inputs.application_id }}"
          fi
          gradle :app:assembleDebug $EXTRA_ARGS --stacktrace --no-daemon

      - name: Verify Debug APK output
        id: verify_apk
        run: |
          PRIMARY_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SELECTED_APK=""

          if [ -f "$PRIMARY_APK" ] && [ -s "$PRIMARY_APK" ]; then
            SELECTED_APK="$PRIMARY_APK"
          else
            DISCOVERED=$(find android/app/build/outputs/apk/debug -maxdepth 2 -type f -name "*.apk" ! -name "*androidTest*" ! -name "*unaligned*" | head -n 1 || true)
            if [ -n "$DISCOVERED" ] && [ -s "$DISCOVERED" ]; then
              SELECTED_APK="$DISCOVERED"
            fi
          fi

          if [ -z "$SELECTED_APK" ] || [ ! -s "$SELECTED_APK" ]; then
            echo "::error::Android Debug APK build failed — no non-empty APK found in android/app/build/outputs/apk/debug."
            exit 1
          fi

          APK_SIZE=$(du -h "$SELECTED_APK" | cut -f1)
          OUT_DIR="android-dist"
          mkdir -p "$OUT_DIR"
          APK_FILENAME="zoya-ai-debug-build-${{ github.run_number }}.apk"
          cp "$SELECTED_APK" "${OUT_DIR}/${APK_FILENAME}"

          echo "Verified APK: $SELECTED_APK ($APK_SIZE)"
          echo "apk_path=${OUT_DIR}/${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK (on tag push or manual release)
        id: build_release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path || secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.application_id }}" ]; then
            EXTRA_ARGS="-PZOYA_APPLICATION_ID=${{ github.event.inputs.application_id }}"
          fi
          gradle :app:assembleRelease $EXTRA_ARGS --stacktrace --no-daemon

      - name: Verify Release APK output
        id: verify_release
        if: steps.build_release.outcome == 'success'
        run: |
          REL_APK=$(find android/app/build/outputs/apk/release -maxdepth 2 -type f -name "*.apk" ! -name "*unaligned*" | head -n 1 || true)
          if [ -n "$REL_APK" ] && [ -s "$REL_APK" ]; then
            mkdir -p android-dist
            REL_NAME="zoya-ai-release-build-${{ github.run_number }}.apk"
            cp "$REL_APK" "android-dist/${REL_NAME}"
            echo "release_apk_path=android-dist/${REL_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_apk_name=${REL_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Google Play App Bundle (.aab)
        id: build_aab
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path || secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.application_id }}" ]; then
            EXTRA_ARGS="-PZOYA_APPLICATION_ID=${{ github.event.inputs.application_id }}"
          fi
          gradle :app:bundleRelease $EXTRA_ARGS --stacktrace --no-daemon

      - name: Verify Google Play App Bundle (.aab) output
        id: verify_aab
        run: |
          PRIMARY_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          SELECTED_AAB=""

          if [ -f "$PRIMARY_AAB" ] && [ -s "$PRIMARY_AAB" ]; then
            SELECTED_AAB="$PRIMARY_AAB"
          else
            DISCOVERED=$(find android/app/build/outputs/bundle -maxdepth 3 -type f -name "*.aab" | head -n 1 || true)
            if [ -n "$DISCOVERED" ] && [ -s "$DISCOVERED" ]; then
              SELECTED_AAB="$DISCOVERED"
            fi
          fi

          if [ -z "$SELECTED_AAB" ] || [ ! -s "$SELECTED_AAB" ]; then
            echo "::error::Android App Bundle (.aab) build failed — no non-empty .aab found in android/app/build/outputs/bundle."
            exit 1
          fi

          AAB_SIZE=$(du -h "$SELECTED_AAB" | cut -f1)
          mkdir -p android-dist
          AAB_FILENAME="zoya-ai-playstore-build-${{ github.run_number }}.aab"
          cp "$SELECTED_AAB" "android-dist/${AAB_FILENAME}"

          echo "Verified AAB: $SELECTED_AAB ($AAB_SIZE)"
          echo "aab_path=android-dist/${AAB_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "aab_name=${AAB_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "aab_size=${AAB_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zoya-ai-android-apk
          path: android-dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Google Play AAB to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zoya-ai-google-play-aab
          path: android-dist/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK & AAB to GitHub Releases
        id: publish_release
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi

          RELEASE_ASSETS="${{ steps.verify_apk.outputs.apk_path }}"
          if [ -n "${{ steps.verify_release.outputs.release_apk_path }}" ] && [ -f "${{ steps.verify_release.outputs.release_apk_path }}" ]; then
            RELEASE_ASSETS="$RELEASE_ASSETS ${{ steps.verify_release.outputs.release_apk_path }}"
          fi
          if [ -n "${{ steps.verify_aab.outputs.aab_path }}" ] && [ -f "${{ steps.verify_aab.outputs.aab_path }}" ]; then
            RELEASE_ASSETS="$RELEASE_ASSETS ${{ steps.verify_aab.outputs.aab_path }}"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" $RELEASE_ASSETS --clobber
          else
            gh release create "$TAG_NAME" $RELEASE_ASSETS \
              --title "Zoya AI Voice Assistant ($TAG_NAME)" \
              --notes "Automated Android APK + Google Play App Bundle (.aab) build #$GITHUB_RUN_NUMBER from commit ${GITHUB_SHA::7}. Download \`.apk\` for direct mobile testing or \`.aab\` for Google Play Console." \
              --latest
          fi

          RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Write Build Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Zoya AI Android APK & AAB Build Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Debug APK**: \`${{ steps.verify_apk.outputs.apk_name }}\` (${{ steps.verify_apk.outputs.apk_size }})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Google Play Bundle (.aab)**: \`${{ steps.verify_aab.outputs.aab_name }}\` (${{ steps.verify_aab.outputs.aab_size }})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifacts**: Download **\`zoya-ai-android-apk\`** and **\`zoya-ai-google-play-aab\`** from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ steps.publish_release.outputs.release_url }}" ]; then
              echo "- **GitHub Release**: [${{ steps.publish_release.outputs.release_tag }}](${{ steps.publish_release.outputs.release_url }})" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "## Zoya AI Android APK & AAB Build Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Inspect the failed step logs above to view exact Gradle, Java, or Vite compilation error details." >> "$GITHUB_STEP_SUMMARY"
          fi
