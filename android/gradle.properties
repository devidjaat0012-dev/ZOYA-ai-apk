# Project-wide Gradle settings for Zoya AI Voice Assistant
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX & Kotlin configuration
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Configurable Android App Identity & Versioning
# Override anytime via CLI: -PZOYA_APPLICATION_ID=com.yourname.zoya
ZOYA_APPLICATION_ID=com.devid.zoya.assistant
ZOYA_APP_NAME=Zoya AI
ZOYA_VERSION_CODE=1
ZOYA_VERSION_NAME=1.0.0
