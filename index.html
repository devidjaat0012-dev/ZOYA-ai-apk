<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0C10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zoya AI" />
    <meta name="application-name" content="Zoya AI" />
    <meta name="description" content="A sassy, witty, and intelligent Indian female AI voice assistant." />
    <meta property="og:title" content="Zoya - AI Voice Assistant" />
    <meta property="og:description" content="A sassy, witty, and intelligent Indian female AI voice assistant." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Zoya - AI Voice Assistant</title>
    <script>
      // Suppress benign Vite HMR WebSocket errors in AI Studio iframe preview where HMR is disabled
      (function () {
        const _origConsoleError = console.error;
        console.error = function (...args) {
          try {
            const str = args
              .map(function (a) {
                return a instanceof Error ? (a.message + ' ' + (a.stack || '')) : String(a);
              })
              .join(' ');
            if (
              str.includes('WebSocket closed without opened') ||
              (str.includes('WebSocket') && str.includes('@vite/client')) ||
              str.includes('[vite] connecting...') ||
              str.includes('[vite] failed to connect to websocket')
            ) {
              return;
            }
          } catch (_) {}
          return _origConsoleError.apply(console, args);
        };

        window.addEventListener('error', function (event) {
          var msg = (event && event.message) || (event && event.error && (event.error.message || String(event.error))) || '';
          var filename = (event && event.filename) || '';
          if (
            msg.includes('WebSocket closed without opened') ||
            (msg.includes('WebSocket') && filename.includes('@vite/client')) ||
            filename.includes('@vite/client')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = reason instanceof Error ? (reason.message + ' ' + (reason.stack || '')) : String(reason || '');
          if (msg.includes('WebSocket closed without opened') || msg.includes('@vite/client')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background:#0A0C10;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#ffffff;text-align:center;padding:24px;user-select:none;">
        <div style="font-size:22px;sm:font-size:26px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;background:linear-gradient(135deg,#ffffff 0%,#e2e8f0 40%,#94a3b8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;">
          Zoya AI Voice Assistant
        </div>
        <div style="font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:0.08em;margin-bottom:24px;">
          Loading...
        </div>
        <div style="width:48px;height:3px;border-radius:99px;background:linear-gradient(90deg,#ec4899,#8b5cf6,#06b6d4);opacity:0.85;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
